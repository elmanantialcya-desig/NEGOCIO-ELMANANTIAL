<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodegApp - Punto de Venta e Inventario</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Alpine.js (para la reactividad y gestión de estado) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JsBarcode CDN para renderizar códigos de barras -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0F2552',
                            pink: '#E6007E',
                            pinkHover: '#C4006B',
                            lightBg: '#F3F5F9',
                            cardBg: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        /* Style scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased selection:bg-brand-pink selection:text-white" x-data="bodegApp()" x-init="initApp()">

    <!-- CONTENEDOR PRINCIPAL RESPONSIVO -->
    <div class="min-h-screen flex flex-col max-w-md md:max-w-4xl lg:max-w-6xl mx-auto bg-white shadow-2xl relative pb-20 md:pb-6">
        
        <!-- HEADER TOP BAR -->
        <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-2">
                <div class="flex items-center text-brand-blue font-extrabold text-2xl tracking-tight">
                    <span>BODEG</span><span class="text-teal-500">App</span>
                </div>
            </div>

            <!-- Tasa del Día & Selector Global -->
            <div class="flex items-center gap-2">
                <div class="bg-slate-50 border border-slate-200 rounded-full px-3 py-1 flex items-center gap-1 text-xs md:text-sm font-semibold text-slate-700">
                    <span class="text-slate-400">Tasa:</span>
                    <span class="text-emerald-600 font-bold">Bs.</span>
                    <input type="number" step="0.01" x-model.number="exchangeRate" @change="saveState()" class="w-16 md:w-20 bg-transparent text-right font-extrabold text-slate-900 focus:outline-none focus:ring-1 focus:ring-brand-pink rounded px-1">
                </div>

                <button @click="toggleCurrencyDisplay()" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-xs font-bold text-brand-blue hover:bg-slate-200 transition">
                    <span x-text="showInBs ? 'Bs' : '$'"></span>
                </button>
            </div>
        </header>

        <!-- CONTENIDO DINÁMICO POR VISTA -->
        <main class="flex-1 p-4 md:p-6 overflow-y-auto">

            <!-- ================= VISTA 1: VENDER / CARRITO ================= -->
            <section x-show="currentTab === 'vender'" x-cloak class="space-y-4">
                <div class="flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-black text-brand-blue">Vender</h1>
                        <p class="text-xs text-slate-400 font-medium">Paso 1 de 2 · Bodega Principal</p>
                    </div>
                    <button @click="openProductSelectorModal = true" class="bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs px-3 py-2 rounded-xl flex items-center gap-1 shadow-sm transition">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>Buscar Lista</span>
                    </button>
                </div>

                <!-- Lector / Búsqueda Rápida por Código de Barras -->
                <div class="bg-slate-900 text-white rounded-3xl p-4 shadow-md space-y-2">
                    <label class="text-[11px] font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="scan-barcode" class="w-4 h-4 text-brand-pink"></i>
                        <span>Escáner / Código de Barras</span>
                    </label>
                    <div class="flex gap-2">
                        <input type="text" x-model="barcodeSearch" @keydown.enter.prevent="scanBarcode()" placeholder="Escanear o escribir código y Enter..." class="flex-1 bg-slate-800 border border-slate-700 rounded-2xl px-3.5 py-2.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-pink">
                        <button @click="scanBarcode()" class="bg-brand-pink hover:bg-brand-pinkHover text-white font-bold px-4 py-2.5 rounded-2xl text-xs flex items-center gap-1 shadow transition">
                            <i data-lucide="corner-down-left" class="w-4 h-4"></i>
                            <span>Agregar</span>
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400">Pasa el lector de código de barras o tipea el código exacto y presiona Enter.</p>
                </div>

                <!-- Lista de Carrito -->
                <div class="bg-white border border-slate-100 rounded-3xl p-4 shadow-sm space-y-4">
                    <div class="flex items-center gap-2 text-slate-700 font-bold text-sm border-b pb-2">
                        <i data-lucide="shopping-cart" class="w-4 h-4 text-brand-pink"></i>
                        <span>Carrito</span>
                    </div>

                    <template x-if="cart.length === 0">
                        <div class="text-center py-12 text-slate-400 space-y-2">
                            <i data-lucide="shopping-bag" class="w-12 h-12 mx-auto stroke-1 text-slate-300"></i>
                            <p class="text-sm">El carrito está vacío</p>
                            <button @click="openProductSelectorModal = true" class="mt-2 text-xs font-bold text-brand-pink underline">Explorar productos</button>
                        </div>
                    </template>

                    <div class="divide-y divide-slate-100 max-h-[50vh] overflow-y-auto pr-1">
                        <template x-for="(item, index) in cart" :key="item.id">
                            <div class="py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2">
                                        <h4 class="font-bold text-slate-800 text-sm leading-tight" x-text="item.name"></h4>
                                        <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase" :class="item.unit === 'kg' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'" x-text="item.unit === 'kg' ? 'Por peso (Kg)' : 'Unidad'"></span>
                                    </div>
                                    <p class="text-xs text-slate-400 font-medium mt-0.5 flex items-center gap-2">
                                        <span x-text="formatCurrency(item.priceUsd)"></span> por <span x-text="item.unit"></span>
                                        <template x-if="item.barcode">
                                            <span class="text-[10px] font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-500" x-text="'#' + item.barcode"></span>
                                        </template>
                                    </p>
                                </div>

                                <!-- Modificador de Cantidad según Tipo de Unidad -->
                                <div class="flex flex-wrap items-center gap-2 bg-slate-50 p-2 rounded-2xl border border-slate-200">
                                    <!-- Controles para productos POR KILOGRAMO -->
                                    <template x-if="item.unit === 'kg'">
                                        <div class="flex items-center gap-1.5 w-full sm:w-auto">
                                            <div class="flex items-center bg-white border border-slate-300 rounded-xl px-2 py-1 shadow-inner">
                                                <input type="number" step="0.001" min="0.001" x-model.number="item.qty" @input="saveState()" class="w-20 text-center text-xs font-black text-slate-900 bg-transparent focus:outline-none">
                                                <span class="text-[10px] font-bold text-slate-400 ml-1">kg</span>
                                            </div>
                                            <!-- Accesos rápidos para sumar peso -->
                                            <div class="flex items-center gap-1">
                                                <button @click="updateCartKgQty(index, -0.1)" class="px-2 py-1 bg-white border border-slate-200 rounded-lg text-[10px] font-bold hover:bg-slate-100 text-slate-700">-100g</button>
                                                <button @click="updateCartKgQty(index, 0.1)" class="px-2 py-1 bg-white border border-slate-200 rounded-lg text-[10px] font-bold hover:bg-slate-100 text-slate-700">+100g</button>
                                                <button @click="updateCartKgQty(index, 0.5)" class="px-2 py-1 bg-slate-200 border border-slate-300 rounded-lg text-[10px] font-bold hover:bg-slate-300 text-slate-800">+500g</button>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Controles para productos POR UNIDAD -->
                                    <template x-if="item.unit !== 'kg'">
                                        <div class="flex items-center gap-2">
                                            <button @click="updateCartQty(index, -1)" class="w-7 h-7 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-700 hover:bg-slate-100 font-bold text-sm">
                                                -
                                            </button>
                                            <span class="w-8 text-center text-xs font-extrabold text-slate-900" x-text="item.qty"></span>
                                            <button @click="updateCartQty(index, 1)" class="w-7 h-7 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-700 hover:bg-slate-100 font-bold text-sm">
                                                +
                                            </button>
                                        </div>
                                    </template>
                                </div>

                                <!-- Subtotal y Acción -->
                                <div class="text-right min-w-[90px] flex sm:flex-col justify-between sm:justify-center items-center sm:items-end border-t sm:border-0 border-slate-100 pt-2 sm:pt-0">
                                    <div>
                                        <p class="font-extrabold text-slate-900 text-xs md:text-sm" x-text="formatCurrency(item.priceUsd * item.qty)"></p>
                                        <p class="text-[10px] font-bold text-slate-400" x-text="'$ ' + (item.priceUsd * item.qty).toFixed(2)"></p>
                                    </div>
                                    <button @click="removeFromCart(index)" class="text-[11px] text-red-500 hover:text-red-700 font-semibold underline sm:mt-1">Eliminar</button>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Resumen del Carrito -->
                    <div class="border-t border-slate-100 pt-4 mt-2 space-y-2">
                        <div class="flex justify-between items-baseline">
                            <span class="text-xs text-slate-500 font-bold uppercase">Total acumulado</span>
                            <div class="text-right">
                                <span class="text-xl md:text-2xl font-black text-brand-blue" x-text="formatBs(getCartTotalUsd() * exchangeRate)"></span>
                                <div class="text-xs font-bold text-slate-400" x-text="'USD ' + getCartTotalUsd().toFixed(2)"></div>
                            </div>
                        </div>

                        <!-- Botón Cobro -->
                        <button @click="prepareCheckout()" :disabled="cart.length === 0" class="w-full bg-brand-blue hover:bg-slate-900 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-brand-blue/20 flex items-center justify-center gap-2 transition active:scale-[0.99]">
                            <span>Continuar al cobro</span>
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                        <p class="text-[11px] text-center text-slate-400 flex items-center justify-center gap-1">
                            <i data-lucide="lock" class="w-3 h-3"></i> Los métodos de pago se abren al confirmar esta lista.
                        </p>
                    </div>
                </div>
            </section>

            <!-- ================= VISTA 2: INVENTARIO ================= -->
            <section x-show="currentTab === 'inventario'" x-cloak class="space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 class="text-2xl font-black text-brand-blue">Inventario</h1>
                        <p class="text-xs text-slate-400 font-medium" x-text="products.length + ' productos registrados'"></p>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] uppercase font-bold text-slate-400 block">Capital Invertido</span>
                        <span class="text-sm font-black text-emerald-600" x-text="formatCurrency(getTotalInventoryCapitalUsd())"></span>
                    </div>
                </div>

                <!-- Buscador y Categorías -->
                <div class="space-y-2">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                        <input type="text" x-model="searchQuery" placeholder="Buscar por nombre o código de barras..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-pink/30">
                    </div>

                    <!-- Filtros por categoría -->
                    <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
                        <button @click="selectedCategoryFilter = 'todas'" :class="selectedCategoryFilter === 'todas' ? 'bg-brand-blue text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition">
                            Todas
                        </button>
                        <template x-for="cat in categories" :key="cat">
                            <button @click="selectedCategoryFilter = cat" :class="selectedCategoryFilter === cat ? 'bg-brand-blue text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition" x-text="cat">
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Botón Nuevo Producto -->
                <button @click="openProductModal()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-2.5 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-sm transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Crear Nuevo Producto</span>
                </button>

                <!-- Tabla de Productos -->
                <div class="bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-sm">
                    <div class="divide-y divide-slate-100">
                        <template x-for="prod in filteredProducts" :key="prod.id">
                            <div class="p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 transition">
                                <div class="flex items-start gap-3">
                                    <div class="w-10 h-10 rounded-2xl bg-teal-50 border border-teal-100 flex items-center justify-center text-teal-600 font-bold text-xs uppercase flex-shrink-0" x-text="prod.name.substring(0, 2)"></div>
                                    <div>
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <h4 class="font-bold text-slate-800 text-sm" x-text="prod.name"></h4>
                                            <template x-if="prod.barcode">
                                                <span class="text-[10px] font-mono bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded text-slate-600 flex items-center gap-1 font-bold">
                                                    <i data-lucide="barcode" class="w-3 h-3 text-slate-400"></i>
                                                    <span x-text="prod.barcode"></span>
                                                </span>
                                            </template>
                                        </div>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-[10px] bg-slate-100 font-semibold px-2 py-0.5 rounded text-slate-600" x-text="prod.category"></span>
                                            <span class="text-xs text-slate-400 font-medium" x-text="prod.stock + ' ' + (prod.unit === 'kg' ? 'kg' : 'unidades')"></span>
                                        </div>

                                        <!-- Renderizado visual del Código de Barras -->
                                        <template x-if="prod.barcode">
                                            <div class="mt-1.5">
                                                <svg :id="'barcode-' + prod.id" class="h-8 max-w-[140px]"></svg>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div class="text-right flex items-center sm:flex-col justify-between sm:justify-center gap-3">
                                    <div>
                                        <div class="font-extrabold text-slate-900 text-sm" x-text="formatCurrency(prod.priceUsd)"></div>
                                        <div class="text-[10px] text-slate-400" x-text="'Costo: $' + (prod.costUsd || 0).toFixed(2)"></div>
