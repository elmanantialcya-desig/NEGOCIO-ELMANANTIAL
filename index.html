<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodegApp - Punto de Venta e Inventario</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Alpine.js (para la reactividad y gestión de estado) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0F2552',
                            pink: '#E6007E',
                            pinkHover: '#C4006B',
                            lightBg: '#F3F5F9',
                            cardBg: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        /* Style scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased selection:bg-brand-pink selection:text-white" x-data="bodegApp()" x-init="initApp()">

    <!-- CONTENEDOR PRINCIPAL RESPONSIVO -->
    <div class="min-h-screen flex flex-col max-w-md md:max-w-4xl lg:max-w-6xl mx-auto bg-white shadow-2xl relative pb-20 md:pb-6">
        
        <!-- HEADER TOP BAR -->
        <header class="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-2">
                <div class="flex items-center text-brand-blue font-extrabold text-2xl tracking-tight">
                    <span>BODEG</span><span class="text-teal-500">App</span>
                </div>
            </div>

            <!-- Tasa del Día & Selector Global -->
            <div class="flex items-center gap-2">
                <div class="bg-slate-50 border border-slate-200 rounded-full px-3 py-1 flex items-center gap-1 text-xs md:text-sm font-semibold text-slate-700">
                    <span class="text-slate-400">Tasa:</span>
                    <span class="text-emerald-600 font-bold">Bs.</span>
                    <input type="number" step="0.01" x-model.number="exchangeRate" @change="saveState()" class="w-16 md:w-20 bg-transparent text-right font-extrabold text-slate-900 focus:outline-none focus:ring-1 focus:ring-brand-pink rounded px-1">
                </div>

                <button @click="toggleCurrencyDisplay()" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-xs font-bold text-brand-blue hover:bg-slate-200 transition">
                    <span x-text="showInBs ? 'Bs' : '$'"></span>
                </button>
            </div>
        </header>

        <!-- CONTENIDO DINÁMICO POR VISTA -->
        <main class="flex-1 p-4 md:p-6 overflow-y-auto">

            <!-- ================= VISTA 1: VENDER / CARRITO ================= -->
            <section x-show="currentTab === 'vender'" x-cloak class="space-y-4">
                <div class="flex justify-between items-end">
                    <div>
                        <h1 class="text-2xl font-black text-brand-blue">Vender</h1>
                        <p class="text-xs text-slate-400 font-medium">Paso 1 de 2 · Bodega Principal</p>
                    </div>
                    <button @click="openProductSelectorModal = true" class="bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs px-3 py-2 rounded-xl flex items-center gap-1 shadow-sm transition">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>Agregar Producto</span>
                    </button>
                </div>

                <!-- Lista de Carrito -->
                <div class="bg-white border border-slate-100 rounded-3xl p-4 shadow-sm space-y-4">
                    <div class="flex items-center gap-2 text-slate-700 font-bold text-sm border-b pb-2">
                        <i data-lucide="shopping-cart" class="w-4 h-4 text-brand-pink"></i>
                        <span>Carrito</span>
                    </div>

                    <template x-if="cart.length === 0">
                        <div class="text-center py-12 text-slate-400 space-y-2">
                            <i data-lucide="shopping-bag" class="w-12 h-12 mx-auto stroke-1 text-slate-300"></i>
                            <p class="text-sm">El carrito está vacío</p>
                            <button @click="openProductSelectorModal = true" class="mt-2 text-xs font-bold text-brand-pink underline">Explorar productos</button>
                        </div>
                    </template>

                    <div class="divide-y divide-slate-100 max-h-[50vh] overflow-y-auto pr-1">
                        <template x-for="(item, index) in cart" :key="item.id">
                            <div class="py-3 flex items-center justify-between gap-2">
                                <div class="flex-1">
                                    <h4 class="font-bold text-slate-800 text-sm leading-tight" x-text="item.name"></h4>
                                    <p class="text-xs text-slate-400 font-medium mt-0.5">
                                        <span x-text="formatCurrency(item.priceUsd)"></span> c/u
                                        <span class="ml-1 text-[10px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-500 uppercase font-semibold" x-text="item.unit"></span>
                                    </p>
                                </div>

                                <!-- Modificador de Cantidad -->
                                <div class="flex items-center gap-1 bg-slate-50 p-1 rounded-full border border-slate-200">
                                    <button @click="updateCartQty(index, -1)" class="w-6 h-6 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-600 hover:bg-slate-100 font-bold text-sm">
                                        -
                                    </button>
                                    
                                    <template x-if="item.unit === 'kg'">
                                        <input type="number" step="0.05" min="0.01" x-model.number="item.qty" @input="saveState()" class="w-12 text-center text-xs font-bold bg-transparent border-b border-transparent focus:border-brand-pink focus:outline-none">
                                    </template>
                                    <template x-if="item.unit !== 'kg'">
                                        <span class="w-8 text-center text-xs font-bold text-slate-800" x-text="item.qty"></span>
                                    </template>

                                    <button @click="updateCartQty(index, 1)" class="w-6 h-6 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-600 hover:bg-slate-100 font-bold text-sm">
                                        +
                                    </button>
                                </div>

                                <!-- Subtotal -->
                                <div class="text-right min-w-[80px]">
                                    <p class="font-extrabold text-slate-900 text-xs md:text-sm" x-text="formatCurrency(item.priceUsd * item.qty)"></p>
                                    <button @click="removeFromCart(index)" class="text-[10px] text-red-500 hover:underline">Eliminar</button>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Resumen del Carrito -->
                    <div class="border-t border-slate-100 pt-4 mt-2 space-y-2">
                        <div class="flex justify-between items-baseline">
                            <span class="text-xs text-slate-500 font-bold uppercase">Total acumulado</span>
                            <div class="text-right">
                                <span class="text-xl md:text-2xl font-black text-brand-blue" x-text="formatBs(getCartTotalUsd() * exchangeRate)"></span>
                                <div class="text-xs font-bold text-slate-400" x-text="'USD ' + getCartTotalUsd().toFixed(2)"></div>
                            </div>
                        </div>

                        <!-- Botón Cobro -->
                        <button @click="prepareCheckout()" :disabled="cart.length === 0" class="w-full bg-brand-blue hover:bg-slate-900 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-brand-blue/20 flex items-center justify-center gap-2 transition active:scale-[0.99]">
                            <span>Continuar al cobro</span>
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                        <p class="text-[11px] text-center text-slate-400 flex items-center justify-center gap-1">
                            <i data-lucide="lock" class="w-3 h-3"></i> Los métodos de pago se abren al confirmar esta lista.
                        </p>
                    </div>
                </div>
            </section>

            <!-- ================= VISTA 2: INVENTARIO ================= -->
            <section x-show="currentTab === 'inventario'" x-cloak class="space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 class="text-2xl font-black text-brand-blue">Inventario</h1>
                        <p class="text-xs text-slate-400 font-medium" x-text="products.length + ' productos registrados'"></p>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] uppercase font-bold text-slate-400 block">Capital Invertido</span>
                        <span class="text-sm font-black text-emerald-600" x-text="formatCurrency(getTotalInventoryCapitalUsd())"></span>
                    </div>
                </div>

                <!-- Buscador y Categorías -->
                <div class="space-y-2">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                        <input type="text" x-model="searchQuery" placeholder="Buscar producto..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-pink/30">
                    </div>

                    <!-- Filtros por categoría -->
                    <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
                        <button @click="selectedCategoryFilter = 'todas'" :class="selectedCategoryFilter === 'todas' ? 'bg-brand-blue text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition">
                            Todas
                        </button>
                        <template x-for="cat in categories" :key="cat">
                            <button @click="selectedCategoryFilter = cat" :class="selectedCategoryFilter === cat ? 'bg-brand-blue text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition" x-text="cat">
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Botón Nuevo Producto -->
                <button @click="openProductModal()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-2.5 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-sm transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Crear Nuevo Producto</span>
                </button>

                <!-- Tabla de Productos -->
                <div class="bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-sm">
                    <div class="divide-y divide-slate-100">
                        <template x-for="prod in filteredProducts" :key="prod.id">
                            <div class="p-3.5 flex items-center justify-between hover:bg-slate-50 transition">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-2xl bg-teal-50 border border-teal-100 flex items-center justify-center text-teal-600 font-bold text-xs uppercase" x-text="prod.name.substring(0, 2)"></div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-sm" x-text="prod.name"></h4>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-[10px] bg-slate-100 font-semibold px-2 py-0.5 rounded text-slate-600" x-text="prod.category"></span>
                                            <span class="text-xs text-slate-400 font-medium" x-text="prod.stock + ' ' + (prod.unit === 'kg' ? 'kg' : 'unidades')"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-right flex items-center gap-3">
                                    <div>
                                        <div class="font-extrabold text-slate-900 text-sm" x-text="formatCurrency(prod.priceUsd)"></div>
                                        <div class="text-[10px] text-slate-400" x-text="'Costo: $' + (prod.costUsd || 0).toFixed(2)"></div>
                                    </div>
                                    <button @click="openProductModal(prod)" class="p-1.5 text-slate-400 hover:text-brand-blue rounded-lg hover:bg-slate-100">
                                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </section>

            <!-- ================= VISTA 3: FIADOS Y CRÉDITOS ================= -->
            <section x-show="currentTab === 'fiados'" x-cloak class="space-y-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-black text-brand-blue">Fiados</h1>
                        <p class="text-xs text-slate-400 font-medium" x-text="debtorsCount + ' clientes con saldo abierto'"></p>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] uppercase font-bold text-slate-400 block">POR COBRAR</span>
                        <span class="text-base font-black text-brand-pink" x-text="formatBs(getTotalDebtUsd() * exchangeRate)"></span>
                    </div>
                </div>

                <button @click="openClientModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2.5 rounded-2xl text-xs flex items-center justify-center gap-2 border border-slate-200 transition">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>Registrar Nuevo Cliente</span>
                </button>

                <!-- Tarjetas de Clientes Fiados -->
                <div class="space-y-3">
                    <template x-for="client in clients" :key="client.id">
                        <div class="bg-white border border-slate-100 rounded-3xl p-4 shadow-sm space-y-3">
                            <div class="flex items-start justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-pink-100 text-brand-pink font-bold flex items-center justify-center text-xs" x-text="getInitials(client.name)"></div>
                                    <div>
                                        <h3 class="font-extrabold text-slate-900 text-sm" x-text="client.name"></h3>
                                        <p class="text-xs text-slate-400 flex items-center gap-1">
                                            <i data-lucide="phone" class="w-3 h-3"></i>
                                            <span x-text="client.phone || 'Sin teléfono'"></span>
                                        </p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-base font-black text-slate-900 block" x-text="formatBs(getClientDebtUsd(client.id) * exchangeRate)"></span>
                                    <span class="text-xs font-bold text-slate-400" x-text="'$ ' + getClientDebtUsd(client.id).toFixed(2)"></span>
                                </div>
                            </div>

                            <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-50">
                                <span class="px-2.5 py-0.5 rounded-full font-bold text-[10px]" :class="getClientDebtUsd(client.id) > 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-500'" x-text="getClientDebtUsd(client.id) > 0 ? '● Saldo Pendiente' : '● Al día'"></span>
                                <button @click="openClientModal(client)" class="text-slate-400 hover:text-brand-blue font-semibold text-[11px]">Editar Cliente</button>
                            </div>

                            <!-- Botón Registrar Abono -->
                            <template x-if="getClientDebtUsd(client.id) > 0">
                                <button @click="openAbonoModal(client)" class="w-full bg-brand-pink hover:bg-brand-pinkHover text-white font-bold py-2.5 px-4 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-md shadow-brand-pink/20 transition">
                                    <i data-lucide="receipt" class="w-4 h-4"></i>
                                    <span>Registrar abono</span>
                                </button>
                            </template>
                        </div>
                    </template>
                </div>
            </section>

            <!-- ================= VISTA 4: ANÁLISIS FINANCIERO ================= -->
            <section x-show="currentTab === 'analisis'" x-cloak class="space-y-4">
                <div>
                    <h1 class="text-2xl font-black text-brand-blue">Análisis financiero</h1>
                    <p class="text-xs text-slate-400 font-medium">Ganancia real, no solo lo que entró en caja</p>
                </div>

                <!-- Banner Resumen Rosa -->
                <div class="bg-gradient-to-r from-brand-pink to-rose-500 rounded-3xl p-4 text-white shadow-lg shadow-brand-pink/20">
                    <div class="flex items-center gap-2 font-bold text-sm">
                        <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                        <span>Resumen</span>
                    </div>
                    <p class="text-xs opacity-90">Vent
