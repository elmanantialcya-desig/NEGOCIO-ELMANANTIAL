<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema El Manantial</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <div class="max-w-4xl mx-auto p-6">
    <header class="mb-8 border-b pb-4">
      <h1 class="text-3xl font-bold text-slate-800">Sistema El Manantial</h1>
      <p class="text-sm text-gray-500">Gestión de Inventario y Ventas</p>
    </header>

    <!-- Formulario para agregar producto -->
    <section class="bg-white p-6 rounded-lg shadow-md mb-8">
      <h2 class="text-xl font-semibold mb-4 text-slate-700">Agregar Nuevo Producto</h2>
      <form id="product-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input type="text" id="p-name" required placeholder="Ej: Arroz 1kg" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Precio ($)</label>
          <input type="number" id="p-price" step="0.01" required placeholder="1.50" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
          <input type="number" id="p-stock" required placeholder="10" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="md:col-span-3">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full transition">
            Guardar en Supabase
          </button>
        </div>
      </form>
    </section>

    <!-- Lista de Productos -->
    <section class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-slate-700">Inventario</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-gray-50 text-xs font-semibold text-gray-600 uppercase">
              <th class="p-3">Producto</th>
              <th class="p-3">Precio ($)</th>
              <th class="p-3">Stock</th>
            </tr>
          </thead>
          <tbody id="products-table-body">
            <tr>
              <td colspan="3" class="p-3 text-center text-gray-500">Cargando productos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE
    // ==========================================
    const SUPABASE_URL =’https://gyqqtpbrnuflyihirffr.supabase.co’; 
    const SUPABASE_ANON_KEY = 'sb_publishable_KYaXggRLKHpZJMPubkyUzw_RovXuiyB';

    const supabaseClient =’sb_publishable_KYaXggRLKHpZJMPubkyUzw_RovXuiyB’ ;

    // Cargar productos al iniciar la página
    document.addEventListener('DOMContentLoaded', fetchProducts);

    // Guardar nuevo producto
    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('p-name').value;
      const price = parseFloat(document.getElementById('p-price').value);
      const stock = parseInt(document.getElementById('p-stock').value);

      const { data, error } = await supabaseClient
        .from('products')
        .insert([{ name, price, stock }]);

      if (error) {
        alert('Error al guardar el producto: ' + error.message);
      } else {
        alert('Producto guardado correctamente');
        document.getElementById('product-form').reset();
        fetchProducts();
      }
    });

    // Función para obtener productos desde Supabase
    async function fetchProducts() {
      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*');

      const tbody = document.getElementById('products-table-body');
      tbody.innerHTML = '';

      if (error) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-red-500">Error al cargar datos: ${error.message}</td></tr>`;
        return;
      }

      if (!products || products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-gray-500">No hay productos registrados.</td></tr>`;
        return;
      }

      products.forEach(p => {
        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50';
        tr.innerHTML = `
          <td class="p-3 font-medium text-slate-800">${p.name}</td>
          <td class="p-3 text-emerald-600 font-semibold">${parseFloat(p.price).toFixed(2)}</td>
          <td class="p-3">${p.stock}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
